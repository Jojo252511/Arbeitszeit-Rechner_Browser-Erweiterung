<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbeitszeit Statistiken & Auswertungen</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="./scripts/chart.umd.js" defer></script>
    <script type="module" src="./dist/darkmode.js" defer></script>
    <script type="module" src="./dist/statistics.js" defer></script>

    <style>
        .stats-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--card-background-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-card i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0.25rem 0;
        }

        .stat-card .label {
            font-size: 0.9rem;
            color: #6c757d;
        }

        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background-color: var(--card-background-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px var(--shadow-color);
            min-height: 350px;
        }

        .chart-card h3 {
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-background-color);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow-color);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .nav-back-btn:hover {
            background-color: var(--primary-hover-color);
        }
    </style>
</head>

<body>
    <button id="dark-mode-toggle" title="Dark Mode umschalten" type="button">
        <i class="fa-solid fa-sun sun-icon"></i>
        <i class="fa-solid fa-moon moon-icon"></i>
    </button>

    <div class="stats-container">
        <div class="filter-bar">
            <a href="index.html" class="nav-back-btn">
                <i class="fa-solid fa-arrow-left"></i> Zurück zum Rechner
            </a>

            <h2><i class="fa-solid fa-chart-pie"></i> Arbeitszeit-Statistiken</h2>

            <div>
                <label for="stats-month-filter" style="margin-right: 0.5rem;">Zeitraum:</label>
                <select id="stats-month-filter" class="modern-input" style="width: auto; display: inline-block;">
                    <option value="all">Gesamter Zeitraum</option>
                </select>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-clock"></i>
                <div class="value" id="stat-total-saldo">0 Std.</div>
                <div class="label">Gesamtsaldo Überstunden</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-business-time"></i>
                <div class="value" id="stat-avg-worktime">0 Std.</div>
                <div class="label">Durchschnittliche Arbeitszeit/Tag</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-calendar-check"></i>
                <div class="value" id="stat-worked-days">0</div>
                <div class="label">Geleistete Arbeitstage</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-umbrella-beach"></i>
                <div class="value" id="stat-vacation-sick">0 / 0</div>
                <div class="label">Urlaub / Krankheitstage</div>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-column"></i> Tagessaldo (Verlauf)</h3>
                <div style="position: relative; height: 280px;">
                    <canvas id="stats-trend-chart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <h3><i class="fa-solid fa-chart-pie"></i> Verteilung nach Tagestypen</h3>
                <div style="position: relative; height: 280px;">
                    <canvas id="stats-pie-chart"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
